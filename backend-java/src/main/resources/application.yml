server:
  port: 8080

spring:
  application:
    name: ai-resume-gateway
  
  datasource:
    url: jdbc:h2:file:./data/resumedb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Configuration for the internal Python AI Service bridge
ai-service:
  url: http://localhost:8000/internal/ai
  key: ${AI_SERVICE_KEY:nexus-cv-default-local-ai-key}

app:
  resume-storage: ${RESUME_STORAGE_DIR:./data/resumes}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345678}

# JWT Configuration Secrets
jwt:
  # 256-bit secret key for HMAC-SHA256 (Should be overridden in production env)
  secret: ${JWT_SECRET:nexus-cv-default-local-jwt-secret-key-32bytes-minimum}
  expiration: 86400000 # 24 hours in milliseconds
